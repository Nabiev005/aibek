<!doctype html>
<html lang="ky" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Набиев Айбек — Портфолио</title>
    <meta name="description" content="Набиев Айбек — Fullstack иштеп чыгуучу, UI/UX жана графикалык дизайнер. Бишкек, Кыргызстан." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Кирилл тамгаларын колдогон шрифттер -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Темa сайт тартылганга чейин коюлат (жымылдабашы үчүн) -->
    <script>
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
